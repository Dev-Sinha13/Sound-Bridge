[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-bridge"
version = "0.1.0"
description = "Local audio search and reproducible frozen-encoder alignment experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1"]

[project.urls]
Repository = "https://github.com/Dev-Sinha13/Sound-Bridge"

[project.optional-dependencies]
models = ["torch>=2.9.1,<3", "transformers>=4.57,<5", "sentencepiece>=0.2", "torchaudio>=2.9.1,<3", "timm>=0.9", "einops>=0.7", "matplotlib>=3.9,<4"]
dev = ["pytest>=8", "ruff>=0.9"]
research = ["py7zr>=0.22,<2"]

[project.scripts]
sonic-bridge = "sonic_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonic_bridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
